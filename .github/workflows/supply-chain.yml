# cargo-deny over the dependency tree; policy lives in deny.toml.
#
# Advisory, not a required check. On PRs it runs only when the dependency set
# or the policy changes, so a RUSTSEC published against an untouched
# dependency cannot turn an unrelated PR red. The weekly run is what catches
# those, and checks advisories alone.

name: Supply chain

on:
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - deny.toml
      - .github/workflows/supply-chain.yml
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - Cargo.lock
      - deny.toml
  schedule:
    - cron: "23 14 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deny:
    name: cargo-deny (${{ matrix.checks }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        checks: [advisories, bans licenses sources]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: github.event_name != 'schedule' || matrix.checks == 'advisories'
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check ${{ matrix.checks }}
